<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="dark">
<meta name="theme-color" content="#07111f">
<meta name="robots" content="noindex">
<title>Henry · chat</title>
<link rel="manifest" href="/public/manifest.webmanifest">
<link rel="icon" href="/public/icon.svg" type="image/svg+xml">
<style>
  :root {
    --bg:#07111f; --bg-deep:#030912; --panel:rgba(9,20,38,.72); --panel-2:rgba(12,28,52,.62);
    --line:rgba(155,190,255,.18); --line-hot:rgba(38,230,255,.42);
    --text:#eef7ff; --muted:#8aa4bf; --dim:#67839f; --cyan:#26e6ff; --blue:#4e7dff; --teal:#35efc3; --amber:#ffc857; --red:#ff7a92;
    --sans:Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
  }
  * { box-sizing:border-box; }
  html { background:var(--bg-deep); }
  html, body { height:100%; }
  body { margin:0; color:var(--text); font:15px/1.55 var(--sans); height:100dvh; display:flex; flex-direction:column; overflow:hidden;
    background:radial-gradient(120% 80% at 12% -8%,rgba(38,230,255,.10),transparent 60%),radial-gradient(100% 70% at 88% -4%,rgba(141,92,255,.13),transparent 62%),linear-gradient(180deg,var(--bg),var(--bg-deep) 70%); }
  button, a, input, textarea { font:inherit; color:inherit; }
  button { cursor:pointer; }
  button:focus-visible, a:focus-visible, textarea:focus-visible, input:focus-visible { outline:2px solid var(--cyan); outline-offset:2px; }

  header { display:flex; align-items:center; gap:8px; padding:max(10px, env(safe-area-inset-top)) 12px 10px; border-bottom:1px solid var(--line); background:rgba(3,9,18,.55); }
  .who { display:flex; align-items:center; gap:10px; min-width:0; flex:1; }
  .dot { width:26px; height:26px; flex:none; border-radius:50%; background:radial-gradient(circle at 50% 38%, #26e6ff 0, #4e7dff 55%, rgba(141,92,255,.5) 78%); box-shadow:0 0 14px rgba(38,230,255,.35); }
  .who div { min-width:0; }
  .who strong { display:block; font-size:15px; }
  #subtitle { display:block; color:var(--muted); font-size:12px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .tool { display:inline-flex; align-items:center; justify-content:center; min-width:44px; min-height:44px; padding:0 12px; border-radius:12px; border:1px solid var(--line);
    background:linear-gradient(180deg,var(--panel-2),var(--panel)); color:var(--muted); text-decoration:none; font-size:13px; white-space:nowrap; }
  .tool:hover { color:var(--text); border-color:var(--line-hot); }
  .tool.accent { color:var(--teal); border-color:rgba(53,239,195,.45); }
  .tool svg { width:18px; height:18px; }
  .label-wide { display:none; }
  @media (min-width:560px) { .label-wide { display:inline; margin-left:6px; } }

  #log { flex:1; overflow-y:auto; padding:16px 12px 8px; display:flex; flex-direction:column; gap:10px; overscroll-behavior:contain; }
  .msg { max-width:min(640px, 88%); padding:10px 13px; border-radius:16px; white-space:pre-wrap; overflow-wrap:anywhere; }
  .msg.henry { align-self:flex-start; background:var(--panel-2); border:1px solid var(--line); border-bottom-left-radius:6px; }
  .msg.visitor { align-self:flex-end; background:rgba(38,230,255,.14); border:1px solid rgba(38,230,255,.3); border-bottom-right-radius:6px; }
  .msg.note { align-self:center; background:none; color:var(--muted); font-size:13px; padding:4px 8px; text-align:center; }
  .msg.error { align-self:flex-start; color:var(--amber); background:rgba(255,200,87,.08); border:1px solid rgba(255,200,87,.3); }
  .typing { display:inline-flex; gap:4px; }
  .typing i { width:6px; height:6px; border-radius:50%; background:var(--muted); animation:blink 1.2s infinite ease-in-out; }
  .typing i:nth-child(2) { animation-delay:.15s; } .typing i:nth-child(3) { animation-delay:.3s; }
  @keyframes blink { 0%,80%,100% { opacity:.25; } 40% { opacity:1; } }

  form#composer { display:flex; gap:8px; align-items:flex-end; padding:10px 12px max(10px, env(safe-area-inset-bottom)); border-top:1px solid var(--line); background:rgba(3,9,18,.6); }
  textarea { flex:1; min-width:0; resize:none; max-height:140px; min-height:44px; padding:11px 12px; border-radius:14px; border:1px solid var(--line); background:var(--panel-2); font-size:16px; line-height:1.35; }
  #send { min-width:64px; min-height:44px; border-radius:14px; border:1px solid var(--line-hot); background:linear-gradient(180deg,rgba(38,230,255,.22),rgba(78,125,255,.16)); color:var(--text); font-weight:600; }
  #send:disabled { opacity:.5; cursor:not-allowed; }
  #count { position:absolute; right:84px; bottom:calc(max(10px, env(safe-area-inset-bottom)) + 48px); font-size:11px; color:var(--dim); pointer-events:none; }

  dialog { width:min(440px, calc(100vw - 24px)); max-height:calc(100dvh - 24px); border-radius:18px; border:1px solid var(--line); background:#0b1830; color:var(--text); padding:0; }
  dialog::backdrop { background:rgba(3,9,18,.7); }
  dialog form { display:flex; flex-direction:column; gap:10px; padding:18px; }
  dialog h2 { margin:0; font-size:18px; }
  dialog p { margin:0; color:var(--muted); font-size:13px; }
  dialog label { display:flex; flex-direction:column; gap:4px; font-size:13px; color:var(--muted); }
  dialog input, dialog textarea { min-height:44px; padding:10px 12px; border-radius:12px; border:1px solid var(--line); background:var(--panel-2); font-size:16px; }
  dialog textarea { min-height:80px; }
  .actions { display:flex; gap:8px; justify-content:flex-end; margin-top:4px; }
  .actions button { min-height:44px; min-width:88px; padding:0 14px; border-radius:12px; border:1px solid var(--line); background:var(--panel-2); }
  .actions button.primary { border-color:var(--line-hot); background:linear-gradient(180deg,rgba(38,230,255,.22),rgba(78,125,255,.16)); font-weight:600; }
  #pingStatus { min-height:1.2em; }
  @media (prefers-reduced-motion:reduce) { * { animation:none !important; transition:none !important; } }
</style>
</head>
<body>
<header>
  <div class="who">
    <span class="dot" aria-hidden="true"></span>
    <div><strong>Henry</strong><span id="subtitle">Chief of staff and AI twin</span></div>
  </div>
  <a class="tool" id="talkLink" href="/public/talk" aria-label="Talk by voice">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 15a3 3 0 0 0 3-3V6a3 3 0 0 0-6 0v6a3 3 0 0 0 3 3z"></path><path d="M19 11a7 7 0 0 1-14 0"></path><line x1="12" y1="18" x2="12" y2="22"></line></svg><span class="label-wide">Talk</span>
  </a>
  <button class="tool accent" id="pingButton" type="button">Ping</button>
  <button class="tool" id="newChat" type="button" aria-label="Start a new chat">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 5v14M5 12h14"></path></svg><span class="label-wide">New</span>
  </button>
</header>

<main id="log" aria-live="polite" aria-label="Conversation"></main>

<form id="composer" autocomplete="off">
  <label class="sr-only" for="message" style="position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0,0,0,0)">Message Henry</label>
  <textarea id="message" rows="1" placeholder="Ask Henry anything" maxlength="1000"></textarea>
  <button id="send" type="submit">Send</button>
</form>
<span id="count" aria-hidden="true"></span>

<dialog id="pingDialog" aria-labelledby="pingTitle">
  <form method="dialog" id="pingForm">
    <h2 id="pingTitle">Ping the owner</h2>
    <p>Leave your details and Henry passes them on. Everything here is optional.</p>
    <label>Your name<input name="name" maxlength="80" autocomplete="name"></label>
    <label>Company<input name="company" maxlength="80" autocomplete="organization"></label>
    <label>Your role<input name="role" maxlength="80" autocomplete="organization-title"></label>
    <label>How to reach you (email, phone, or profile link)<input name="contact" maxlength="120" autocomplete="email"></label>
    <label>Message<textarea name="message" maxlength="500"></textarea></label>
    <p id="pingStatus" role="status"></p>
    <div class="actions">
      <button type="button" id="pingCancel">Cancel</button>
      <button type="submit" class="primary" id="pingSend">Send</button>
    </div>
  </form>
</dialog>

<script>
(() => {
  const $ = (id) => document.getElementById(id);
  const log = $('log'), form = $('composer'), input = $('message'), send = $('send'), count = $('count');
  const pingDialog = $('pingDialog'), pingForm = $('pingForm'), pingStatus = $('pingStatus');
  let config = { ownerName: 'the owner', opening: '', available: true, maxMessageChars: 1000, ping: true };
  let busy = false;

  function add(role, text) {
    const el = document.createElement('div');
    el.className = 'msg ' + role;
    el.textContent = text;
    log.appendChild(el);
    log.scrollTop = log.scrollHeight;
    return el;
  }
  function typing() {
    const el = document.createElement('div');
    el.className = 'msg henry';
    el.setAttribute('aria-label', 'Henry is typing');
    el.innerHTML = '<span class="typing"><i></i><i></i><i></i></span>';
    log.appendChild(el);
    log.scrollTop = log.scrollHeight;
    return el;
  }
  function setBusy(value) { busy = value; send.disabled = value || !config.available; }
  function updateCount() {
    const left = config.maxMessageChars - input.value.length;
    count.textContent = left < 120 ? String(left) : '';
    input.style.height = 'auto';
    input.style.height = Math.min(140, input.scrollHeight) + 'px';
  }

  async function ask(text) {
    setBusy(true);
    add('visitor', text);
    const pending = typing();
    try {
      const response = await fetch('/api/public/chat', {
        method: 'POST', credentials: 'same-origin', headers: { 'content-type': 'application/json' },
        body: JSON.stringify({ message: text }),
      });
      if (!response.ok || !response.body) {
        let data = {}; try { data = await response.json(); } catch {}
        pending.remove(); add('error', data.error || 'Sorry, something went wrong.');
        return;
      }
      const reader = response.body.getReader(), decoder = new TextDecoder();
      let buffer = '', answered = false;
      for (;;) {
        const { value, done } = await reader.read();
        if (done) break;
        buffer += decoder.decode(value, { stream: true });
        const blocks = buffer.split('\n\n'); buffer = blocks.pop();
        for (const block of blocks) {
          const event = (block.match(/^event: (.+)$/m) || [])[1];
          const raw = (block.match(/^data: (.+)$/m) || [])[1];
          if (!raw) continue;
          let data; try { data = JSON.parse(raw); } catch { continue; }
          if (event === 'status' && data.state === 'queued') pending.setAttribute('aria-label', 'Henry will answer in a moment');
          else if (event === 'done' && !answered) { answered = true; pending.remove(); add('henry', data.response || ''); }
          else if (event === 'error') { answered = true; pending.remove(); add('error', data.error || 'Sorry, something went wrong.'); }
        }
      }
      if (!answered) { pending.remove(); add('error', 'The connection dropped. Please ask again.'); }
    } catch {
      pending.remove(); add('error', 'The connection dropped. Please ask again.');
    } finally {
      setBusy(false);
      input.focus();
    }
  }

  form.addEventListener('submit', (event) => {
    event.preventDefault();
    const text = input.value.trim();
    if (!text || busy || !config.available) return;
    input.value = ''; updateCount();
    void ask(text);
  });
  input.addEventListener('input', updateCount);
  input.addEventListener('keydown', (event) => {
    if (event.key === 'Enter' && !event.shiftKey && !event.isComposing) { event.preventDefault(); form.requestSubmit(); }
  });

  $('newChat').addEventListener('click', async () => {
    if (busy) return;
    try { await fetch('/api/public/reset', { method: 'POST', credentials: 'same-origin', headers: { 'content-type': 'application/json' }, body: '{}' }); } catch {}
    log.textContent = '';
    add('henry', config.opening);
  });

  function openPing() {
    pingStatus.textContent = '';
    $('pingSend').disabled = false;
    if (typeof pingDialog.showModal === 'function') pingDialog.showModal(); else pingDialog.setAttribute('open', '');
  }
  $('pingButton').addEventListener('click', openPing);
  $('pingCancel').addEventListener('click', () => pingDialog.close());
  pingForm.addEventListener('submit', async (event) => {
    event.preventDefault();
    const fields = Object.fromEntries(new FormData(pingForm).entries());
    $('pingSend').disabled = true;
    pingStatus.textContent = 'Sending…';
    try {
      const response = await fetch('/api/public/ping', {
        method: 'POST', credentials: 'same-origin', headers: { 'content-type': 'application/json' }, body: JSON.stringify(fields),
      });
      const data = await response.json().catch(() => ({}));
      pingStatus.textContent = data.message || data.error || (response.ok ? 'Sent.' : 'Could not send right now.');
      if (response.ok) { add('note', data.message || 'Sent.'); setTimeout(() => pingDialog.close(), 1400); }
      else $('pingSend').disabled = response.status === 409;
    } catch {
      pingStatus.textContent = 'Could not send right now.';
      $('pingSend').disabled = false;
    }
  });

  fetch('/api/public/config', { credentials: 'same-origin' })
    .then((response) => response.ok ? response.json() : Promise.reject(new Error('HTTP ' + response.status)))
    .then((data) => {
      config = { ...config, ...data };
      const owner = config.ownerName || 'the owner';
      $('subtitle').textContent = owner + "'s chief of staff and AI twin";
      $('pingButton').textContent = 'Ping ' + (owner.split(/\s+/)[0] || owner);
      $('pingButton').setAttribute('aria-label', 'Ping ' + owner + ' with your details');
      $('pingTitle').textContent = 'Ping ' + owner;
      input.maxLength = config.maxMessageChars;
      if (!config.voice || config.voice.stt === false) $('talkLink').hidden = true;
      if (!config.ping) $('pingButton').hidden = true;
      add('henry', config.opening || 'Hi, I\'m Henry. Ask me anything.');
      if (!config.available) { add('note', "Henry's public profile isn't published yet. Please check back soon."); input.disabled = true; }
      setBusy(false);
      if (new URLSearchParams(location.search).get('ping') === '1' && config.ping) openPing();
    })
    .catch(() => { add('henry', "Hi, I'm Henry. Ask me anything."); setBusy(false); });
  setBusy(true);
})();
</script>
</body>
</html>
