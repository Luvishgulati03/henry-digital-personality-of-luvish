<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="dark">
<meta name="theme-color" content="#07111f">
<title>Henry · talk</title>
<style>
  :root {
    /* Henry's constellation palette (src/dashboard/page.ts). */
    --bg:#07111f; --bg-deep:#030912; --panel:rgba(9,20,38,.72); --panel-2:rgba(12,28,52,.62);
    --line:rgba(155,190,255,.18); --line-hot:rgba(38,230,255,.42);
    --text:#eef7ff; --muted:#8aa4bf; --dim:#67839f;
    --cyan:#26e6ff; --blue:#4e7dff; --violet:#8d5cff; --teal:#35efc3; --amber:#ffc857; --red:#ff7a92;
    --mono:ui-monospace,SFMono-Regular,Menlo,Monaco,Consolas,monospace;
    --sans:Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
    --orb: clamp(220px, 40vmin, 360px);
  }
  * { box-sizing:border-box; }
  html { background:var(--bg-deep); }
  html, body { height:100%; }
  body { margin:0; color:var(--text); font:14px/1.55 var(--sans); overflow:hidden; height:100dvh;
    background:radial-gradient(120% 80% at 12% -8%,rgba(38,230,255,.10),transparent 60%),radial-gradient(100% 70% at 88% -4%,rgba(141,92,255,.13),transparent 62%),radial-gradient(120% 90% at 50% 108%,rgba(78,125,255,.08),transparent 60%),linear-gradient(180deg,var(--bg),var(--bg-deep) 70%); }
  button, a { font:inherit; color:inherit; }
  button { cursor:pointer; }
  button:focus-visible, a:focus-visible { outline:2px solid var(--cyan); outline-offset:3px; }
  .sr-only { position:absolute; width:1px; height:1px; padding:0; margin:-1px; overflow:hidden; clip:rect(0,0,0,0); white-space:nowrap; border:0; }

  .app { height:100%; height:100dvh; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:14px; padding:20px; position:relative; }

  .topbar { position:fixed; top:max(14px, env(safe-area-inset-top)); left:14px; right:14px; display:flex; align-items:center; justify-content:space-between; gap:10px; z-index:5; pointer-events:none; }
  .topbar > * { pointer-events:auto; }
  .nav { display:flex; gap:8px; }
  .nav a { display:inline-flex; align-items:center; min-height:34px; padding:0 12px; border:1px solid var(--line); border-radius:11px; background:linear-gradient(180deg,var(--panel-2),var(--panel)); color:var(--muted); text-decoration:none; font:11px var(--mono); letter-spacing:.07em; text-transform:uppercase; }
  .nav a:hover { color:var(--text); border-color:var(--line-hot); }
  body.embed .nav { display:none; }

  #mute { width:40px; height:40px; border-radius:12px; border:1px solid var(--line); background:linear-gradient(180deg,var(--panel-2),var(--panel)); display:grid; place-items:center; color:var(--muted); }
  #mute:hover { color:var(--text); border-color:var(--line-hot); }
  #mute[aria-pressed="true"] { background:rgba(255,200,87,.14); color:var(--amber); border-color:rgba(255,200,87,.45); }
  #mute svg { width:18px; height:18px; }
  /* Embedded in chat.html the parent's close button sits top-right: keep mute clear of it. */
  body.embed .topbar { justify-content:flex-start; }

  .badges { position:fixed; top:calc(max(14px, env(safe-area-inset-top)) + 50px); left:50%; transform:translateX(-50%); display:flex; gap:6px; flex-wrap:wrap; justify-content:center; z-index:4; }
  body.embed .badges { top:max(14px, env(safe-area-inset-top)); }
  .badge { display:inline-flex; align-items:center; gap:6px; border:1px solid var(--line); border-radius:99px; padding:3px 10px; color:var(--muted); font:10px var(--mono); letter-spacing:.1em; text-transform:uppercase; background:rgba(3,9,18,.6); }
  .badge[hidden] { display:none; }
  .badge.private { color:var(--amber); border-color:rgba(255,200,87,.45); }
  .badge.writes { color:var(--violet); border-color:rgba(141,92,255,.5); }
  .badge i { width:6px; height:6px; border-radius:50%; background:currentColor; }

  #talk { position:relative; width:var(--orb); height:var(--orb); border-radius:50%; border:0; padding:0; background:transparent; display:grid; place-items:center; touch-action:manipulation; -webkit-tap-highlight-color:transparent; user-select:none; }
  #talk canvas { position:absolute; inset:-40%; width:180%; height:180%; pointer-events:none; }
  #talk .glyph { position:relative; width:calc(var(--orb) * .17); height:calc(var(--orb) * .17); color:var(--text); transition:transform .25s ease, color .25s ease; filter:drop-shadow(0 2px 8px rgba(0,0,0,.6)); }
  #talk:hover .glyph { transform:scale(1.06); }
  #talk[aria-pressed="true"] .glyph { color:#fff; }
  #talk:focus-visible { outline:2px solid var(--cyan); outline-offset:8px; }
  #talk:disabled { cursor:not-allowed; }
  #talk:disabled .glyph { color:var(--dim); transform:none; }

  .status { text-align:center; min-height:26px; position:relative; z-index:2; }
  .status strong { display:block; font:600 clamp(16px,2.4vw,20px)/1.2 var(--sans); letter-spacing:-.01em; color:var(--muted); }
  .status[data-mode="listening"] strong { color:var(--cyan); }
  .status[data-mode="speaking"] strong, .status[data-mode="greeting"] strong { color:var(--teal); }
  .status[data-mode="error"] strong { color:var(--red); }
  #note { margin:6px auto 0; max-width:44ch; color:var(--dim); font-size:12.5px; }
  #note:empty { display:none; }

  .captions { width:min(680px,92vw); text-align:center; position:fixed; bottom:max(16px, env(safe-area-inset-bottom)); left:50%; transform:translateX(-50%); display:flex; flex-direction:column; align-items:center; gap:6px; pointer-events:none; }
  .captions[hidden] { display:none; }
  #heard { font:12px/1.5 var(--mono); color:var(--muted); margin:0; max-width:60ch; overflow-wrap:anywhere; }
  #heard:not(:empty)::before { content:"you · "; color:var(--dim); }
  #reply { font:15px/1.5 var(--sans); color:var(--text); margin:0; max-width:60ch; overflow-wrap:anywhere; }

  audio#audioPlayback { position:fixed; bottom:14px; left:50%; transform:translateX(-50%); width:min(320px,90%); height:34px; filter:invert(.92) hue-rotate(180deg) saturate(.6); border-radius:999px; z-index:4; }
  audio#audioPlayback[hidden] { display:none; }

  @media (max-width:480px) { .nav a { padding:0 10px; } .badges { top:calc(max(14px, env(safe-area-inset-top)) + 48px); } }
  @media (prefers-reduced-motion:reduce) { * { transition:none !important; } }
</style>
</head>
<body>
<div class="app">
  <div class="topbar">
    <nav class="nav" aria-label="Henry">
      <a href="/">Henry</a>
      <a href="/chat">Chat</a>
    </nav>
    <button id="mute" type="button" aria-pressed="false" aria-label="Mute Henry's voice">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
        <path d="M11 5 6 9H2v6h4l5 4z"></path><path d="M15.5 8.5a5 5 0 0 1 0 7"></path><path d="M18.5 5.5a9 9 0 0 1 0 13"></path>
      </svg>
    </button>
  </div>

  <div class="badges" aria-live="polite">
    <span class="badge private" id="privateBadge" hidden title="Henry only says a neutral status line out loud; transcripts are not kept"><i></i>Private mode</span>
    <span class="badge writes" id="writesBadge" hidden title="Voice turns can stage drafts. Approvals and sends stay typed."><i></i>Voice can draft</span>
  </div>

  <button id="talk" type="button" aria-pressed="false" aria-label="Tap to talk">
    <canvas id="orbCanvas" aria-hidden="true"></canvas>
    <svg class="glyph" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
      <path d="M12 15a3 3 0 0 0 3-3V6a3 3 0 0 0-6 0v6a3 3 0 0 0 3 3z"></path><path d="M19 11a7 7 0 0 1-14 0"></path><line x1="12" y1="18" x2="12" y2="22"></line><line x1="8" y1="22" x2="16" y2="22"></line>
    </svg>
  </button>

  <div class="status" id="status" aria-live="polite"><strong id="state">Tap to talk</strong><p id="note"></p></div>

  <div class="captions" id="captions">
    <p id="heard"></p>
    <p id="reply" aria-live="polite"></p>
  </div>

  <audio id="audioPlayback" preload="metadata" aria-label="Henry speech playback" controls hidden></audio>
</div>

<script src="/vendor/vad/bundle.min.js"></script>
<script>
/* ---------- The orb ----------
 * Ported from Kelly's talk page with Henry's palette: layered translucent blobs whose outlines
 * ripple with a few slow sines. `level` (0..1) comes from a live analyser on the microphone or on
 * Henry's playback, so silence is calm and speech makes the rings swell. One
 * requestAnimationFrame, paused when the tab is hidden; a still ring under reduced motion.
 */
const HenryOrb = (() => {
  const BLOBS = [
    { rgb:[38,230,255],  base:.66, k:[.10,.06,.04], f:[3,5,2],  s:[.55,-.37,.23], p:0.0, drift:.11 },
    { rgb:[78,125,255],  base:.56, k:[.08,.05,.05], f:[2,4,7],  s:[-.41,.29,.19], p:1.9, drift:-.09 },
    { rgb:[53,239,195],  base:.48, k:[.09,.07,.03], f:[4,3,6],  s:[.33,-.51,.27], p:3.3, drift:.14 },
    { rgb:[141,92,255],  base:.42, k:[.07,.06,.05], f:[5,2,3],  s:[-.29,.44,-.21], p:4.7, drift:-.12 },
    { rgb:[255,122,146], base:.34, k:[.06,.05,.04], f:[3,6,4],  s:[.47,.25,-.36], p:0.8, drift:.08 },
  ];
  const MOOD = {
    idle:         { alpha:[.50,.42,.34,.44,.10], scale:.86, wobble:.35, spin:.25 },
    recording:    { alpha:[.74,.56,.40,.34,.12], scale:1.0, wobble:1.0, spin:.6 },
    transcribing: { alpha:[.34,.58,.30,.62,.10], scale:.82, wobble:.25, spin:1.8 },
    speaking:     { alpha:[.34,.30,.84,.54,.10], scale:.95, wobble:.9, spin:.5 },
    error:        { alpha:[.26,.22,.10,.14,.95], scale:.9, wobble:.2, spin:.2 },
  };
  function mount(canvas) {
    const ctx = canvas.getContext('2d');
    const reduced = matchMedia('(prefers-reduced-motion: reduce)').matches;
    let state = 'idle', level = 0, shown = 0, raf = 0, t0 = performance.now(), errorAt = -1, alive = true;
    const mix = { alpha:[...MOOD.idle.alpha], scale:MOOD.idle.scale, wobble:MOOD.idle.wobble, spin:MOOD.idle.spin };
    function fit() {
      const rect = canvas.getBoundingClientRect();
      const dpr = Math.min(2, window.devicePixelRatio || 1);
      const size = Math.max(1, Math.round(rect.width));
      canvas.width = Math.round(size * dpr); canvas.height = Math.round(size * dpr);
    }
    const ro = 'ResizeObserver' in window ? new ResizeObserver(fit) : null; ro?.observe(canvas); fit();
    function blobPath(cx, cy, r, b, t, wobble, spin) {
      ctx.beginPath();
      const steps = 72, rot = t * b.drift * spin;
      for (let i = 0; i <= steps; i++) {
        const a = (i / steps) * Math.PI * 2 + rot;
        let d = 0;
        for (let j = 0; j < 3; j++) d += b.k[j] * wobble * Math.sin(b.f[j] * a + t * b.s[j] * 2.2 + b.p);
        const rr = r * (1 + d);
        const x = cx + Math.cos(a) * rr, y = cy + Math.sin(a) * rr;
        i ? ctx.lineTo(x, y) : ctx.moveTo(x, y);
      }
      ctx.closePath();
    }
    function frame(now) {
      if (!alive) return;
      raf = 0;
      const t = (now - t0) / 1000;
      shown += (level - shown) * (level > shown ? .38 : .07);
      const mood = MOOD[state] || MOOD.idle;
      for (let i = 0; i < 5; i++) mix.alpha[i] += (mood.alpha[i] - mix.alpha[i]) * .06;
      mix.scale += (mood.scale - mix.scale) * .06; mix.wobble += (mood.wobble - mix.wobble) * .08; mix.spin += (mood.spin - mix.spin) * .05;
      const W = canvas.width, c = W / 2, R = W / 3.6;
      ctx.setTransform(1, 0, 0, 1, 0, 0); ctx.clearRect(0, 0, W, W);
      const breath = reduced ? 0 : Math.sin(t * (Math.PI * 2 / 4.2)) * .025;
      const live = state === 'recording' || state === 'speaking' ? shown : 0;
      const scale = mix.scale * (1 + breath + live * .24);
      const errorFlash = errorAt >= 0 ? Math.max(0, 1 - (t - errorAt) / .9) : 0;
      ctx.globalCompositeOperation = 'screen';
      ctx.filter = 'blur(' + (W * (reduced ? .012 : .016)) + 'px)';
      for (let i = 0; i < 5; i++) {
        const b = BLOBS[i];
        const a = Math.min(1, mix.alpha[i] + (i === 4 ? errorFlash : 0) + live * (i < 2 ? .15 : i === 2 ? .12 : .06));
        if (a < .02) continue;
        const wobble = reduced ? 0 : mix.wobble + live * 1.6;
        const r = R * (.78 + .07 * i) * scale * (1 + (reduced ? 0 : .02 * Math.sin(t * .8 + i)));
        const swing = R * (.12 + .10 * mix.spin + live * .08);
        const ox = reduced ? 0 : Math.cos(t * .35 + b.p) * swing, oy = reduced ? 0 : Math.sin(t * .29 + b.p) * swing;
        const g = ctx.createRadialGradient(c + ox, c + oy, r * .4, c + ox, c + oy, r);
        g.addColorStop(0, 'rgba(' + b.rgb + ',' + (a * .35) + ')'); g.addColorStop(.62, 'rgba(' + b.rgb + ',' + a + ')'); g.addColorStop(1, 'rgba(' + b.rgb + ',0)');
        ctx.fillStyle = g;
        blobPath(c + ox, c + oy, r, b, reduced ? 0 : t, wobble, mix.spin);
        ctx.fill();
      }
      ctx.filter = 'none';
      if (state === 'transcribing' && !reduced && ctx.createConicGradient) {
        const g = ctx.createConicGradient(t * 3.2, c, c);
        g.addColorStop(0, 'rgba(78,125,255,0)'); g.addColorStop(.7, 'rgba(78,125,255,0)'); g.addColorStop(.92, 'rgba(38,230,255,.9)'); g.addColorStop(1, 'rgba(78,125,255,0)');
        ctx.strokeStyle = g; ctx.lineWidth = W * .012; ctx.beginPath(); ctx.arc(c, c, R * .9 * scale, 0, Math.PI * 2); ctx.stroke();
      }
      ctx.globalCompositeOperation = 'source-over';
      const inner = R * .52 * (1 + live * .06);
      const disc = ctx.createRadialGradient(c, c - inner * .3, inner * .1, c, c, inner);
      disc.addColorStop(0, 'rgba(12,28,52,.97)'); disc.addColorStop(1, 'rgba(3,9,18,.95)');
      ctx.fillStyle = disc; ctx.beginPath(); ctx.arc(c, c, inner, 0, Math.PI * 2); ctx.fill();
      ctx.strokeStyle = state === 'recording' ? 'rgba(38,230,255,' + (.35 + live * .5) + ')' : 'rgba(155,190,255,.14)'; ctx.lineWidth = Math.max(1, W * .004); ctx.stroke();
      if (!reduced || state !== 'idle') raf = requestAnimationFrame(frame);
    }
    function kick() { if (!raf && alive && !document.hidden) raf = requestAnimationFrame(frame); }
    document.addEventListener('visibilitychange', () => { if (document.hidden) { cancelAnimationFrame(raf); raf = 0; } else kick(); });
    kick();
    return {
      setState(next) {
        if (next === 'error') { errorAt = (performance.now() - t0) / 1000; next = 'idle'; }
        state = next in MOOD ? next : 'idle';
        if (state !== 'recording' && state !== 'speaking') level = 0;
        kick();
      },
      setLevel(v) { level = Math.max(0, Math.min(1, Number(v) || 0)); kick(); },
      get state() { return state; },
      destroy() { alive = false; cancelAnimationFrame(raf); ro?.disconnect(); },
    };
  }
  return { mount };
})();
window.HenryOrb = HenryOrb;

(() => {
  const $ = (id) => document.getElementById(id);
  const talkBtn = $('talk'), status = $('status'), stateEl = $('state'), noteEl = $('note');
  const muteBtn = $('mute');
  const captionsEl = $('captions'), heardEl = $('heard'), replyEl = $('reply');
  const privateBadge = $('privateBadge'), writesBadge = $('writesBadge');
  const playback = $('audioPlayback');
  const orb = HenryOrb.mount($('orbCanvas'));

  const TARGET_RATE = 16000;
  const CONVERSATION_KEY = 'henry.voice.conversationId';
  const ID_PATTERN = /^[A-Za-z0-9_-]{1,80}$/;

  /* Testing hook: every timing constant and threshold is overridable so a headless run
     (fake microphone, no real silence) can drive the state machine deterministically. */
  const testing = {
    speechMs: 250,
    silenceMs: 700,
    longSilenceMs: 1400,
    longSilenceAfterMs: 4000,
    hardCapMs: 25000,
    repromptMs: 8000,
    sleepMs: 15000,
    rearmMs: 300,
    fillerMs: 1200,
    secondFillerMs: 12000,
    toolFillerMs: 300,
    preSpeechPadMs: 300,
    sileroPositive: .55,
    sileroNegative: .35,
    speechThreshold: .12,
    silenceThreshold: .06,
    floor: .008,
    levelOverride: null,
    get vadMode() { return vadMode; },
    get micActive() { return !!(stream && stream.getTracks().some(t => t.readyState === 'live')); },
    get conversationId() { return conversationId; },
    get fillersPlayed() { return fillersPlayed; },
    get vadRunning() { return sileroRunning; },
    get voiceStatus() { return voiceStatus; },
  };
  window.HenryTalk = {
    testing,
    get state() { return state; },
  };

  const params = new URLSearchParams(location.search);
  const embedded = params.get('embed') === '1';
  if (embedded) document.body.classList.add('embed');

  /* ---------- captions: on by default (the owner reads too); ?captions=0 hides them ---------- */
  const captionsOn = params.get('captions') !== '0';
  captionsEl.hidden = !captionsOn;
  function clearCaptions() { heardEl.textContent = ''; replyEl.textContent = ''; }
  function setHeard(text) { heardEl.textContent = text || ''; }
  function setReply(text) { replyEl.textContent = text || ''; }
  function setNote(text) { noteEl.textContent = text || ''; }

  /* ---------- mute ---------- */
  let muted = false;
  try { muted = localStorage.getItem('henry.talk.muted') === '1'; } catch {}
  function applyMuted() {
    muteBtn.setAttribute('aria-pressed', String(muted));
    muteBtn.setAttribute('aria-label', muted ? "Unmute Henry's voice" : "Mute Henry's voice");
  }
  applyMuted();
  muteBtn.addEventListener('click', () => {
    muted = !muted;
    try { localStorage.setItem('henry.talk.muted', muted ? '1' : '0'); } catch {}
    applyMuted();
  });

  /* ---------- voice status: availability, private mode, allow-writes ---------- */
  let voiceStatus = null;
  const canSpeak = () => !muted && !(voiceStatus && voiceStatus.ttsEnabled === false);
  function applyStatus(data) {
    voiceStatus = data;
    privateBadge.hidden = !data.privateMode;
    writesBadge.hidden = !data.allowWrites;
    if (!data.available) {
      talkBtn.disabled = true;
      setState('error', data.talkEnabled === false ? 'Talk is off' : 'Voice is off');
      setNote(data.reason || 'Local voice is not available.');
    } else {
      talkBtn.disabled = false;
      if (state === 'idle' || state === 'error') setState('idle', 'Tap to talk');
      setNote(data.reason || '');
    }
  }
  const statusReady = fetch('/api/voice/status', { credentials: 'same-origin' })
    .then((r) => r.ok ? r.json() : Promise.reject(new Error('HTTP ' + r.status)))
    .then(applyStatus)
    .catch(() => { setNote("Couldn't reach Henry's voice service. You can still try."); });

  /* ---------- state ---------- */
  let state = 'idle'; // idle | greeting | listening | thinking | speaking | error
  let sessionId = 0, sessionActive = false, sessionTurns = 0;

  /* ---------- ONE ongoing voice conversation ----------
     Henry remembers earlier voice sessions: the first session creates a conversation titled
     "Voice" and its id is kept in localStorage; later sessions reuse it (recreated if the server
     no longer has it). Embedded in the chat page (?embed=1&conversationId=...), a session joins
     the chat's open conversation instead and tells the parent after each turn. */
  const embedConversationId = ID_PATTERN.test(params.get('conversationId') || '') ? params.get('conversationId') : null;
  let conversationId = null, conversationReady = Promise.resolve();
  function storedConversationId() {
    try { const value = localStorage.getItem(CONVERSATION_KEY); return ID_PATTERN.test(value || '') ? value : null; } catch { return null; }
  }
  function rememberConversation(id) {
    try { if (id) localStorage.setItem(CONVERSATION_KEY, id); else localStorage.removeItem(CONVERSATION_KEY); } catch {}
  }
  function notifyParent(event) {
    if (!embedded || window.parent === window) return;
    try { window.parent.postMessage({ type: 'henry-talk', event, conversationId }, location.origin); } catch {}
  }
  async function createVoiceConversation() {
    const response = await fetch('/api/conversations', {
      method: 'POST', credentials: 'same-origin', headers: { 'content-type': 'application/json' }, body: JSON.stringify({ title: 'Voice' }),
    });
    const data = response.ok ? await response.json() : null;
    const id = data && data.conversation && data.conversation.id;
    if (!id) return null;
    rememberConversation(id);
    return id;
  }
  async function openConversation(id) {
    if (embedConversationId) { conversationId = embedConversationId; return; }
    try {
      const saved = storedConversationId();
      if (saved) {
        const check = await fetch('/api/chat/history?conversationId=' + encodeURIComponent(saved), { credentials: 'same-origin' });
        if (id !== sessionId) return;
        if (check.status !== 404) { conversationId = saved; return; }
        rememberConversation(null);
      }
      const created = await createVoiceConversation();
      if (id === sessionId && created) conversationId = created;
    } catch { /* no conversation: the turn falls back to the active one */ }
  }

  /* ---------- session activity events: talk.session.started / talk.session.ended ---------- */
  function reportSession(event, extra) {
    try {
      void fetch('/api/voice/talk/session', {
        method: 'POST', credentials: 'same-origin', headers: { 'content-type': 'application/json' },
        body: JSON.stringify({ event, ...extra }),
      }).catch(() => {});
    } catch {}
  }
  let stream = null, mimeType = null;
  let meterCtx = null, analyser = null;
  let playCtx = null, playAnalyser = null, playRaf = 0;
  let listenRaf = 0;
  let capturing = false, recorder = null, chunks = [], recordingStartedAt = 0;
  let speechSince = 0, silenceSince = 0;
  let lastActivityAt = 0, repromptedYet = false, repromptAt = 0;
  let playbackBusy = false;
  let speaking = false, speakAbort = null, playQueue = [], playingUrl = null, activePlaybackAbort = null;
  let vadMode = 'energy', sileroVad = null;
  let sileroSpeechAt = 0, sileroLong = false, sileroDiscard = false, sileroRunning = false;
  let fillerTimers = [], fillerDone = Promise.resolve(), fillersPlayed = 0;
  let turnCounter = 0, turnSpeech = null, chatAbort = null;

  function sleep(ms) { return new Promise((resolve) => setTimeout(resolve, ms)); }

  function paintOrb() {
    let mood = 'idle';
    if (state === 'listening') mood = capturing ? 'recording' : 'idle';
    else if (state === 'thinking') mood = 'transcribing';

          const ev = block.match(/^event: (.+)$/m)?.[1], raw = block.match(/^data: (.+)$/m)?.[1]; if (!raw) continue;
          let data; try { data = JSON.parse(raw); } catch { continue; }
          if (stale()) return;
          if (ev === 'gathering') {
            // Once per turn, and never once the answer is already here.
            if (!gatheringSeen && !spokenArrived) {
              gatheringSeen = true;
              scheduleFillers(id, data.reason === 'tool' ? testing.toolFillerMs : testing.fillerMs);
            }
          }
          else if (ev === 'spoken') { spokenArrived = true; if (canSpeak()) queueSpeech(turn, data.text); else setReply(data.text || ''); }
          else if (ev === 'done') {
            cancelFillers();
            if (data.conversationId && !conversationId) conversationId = data.conversationId;
            notifyParent('turn');
            if (!spokenArrived && data.spoken) { if (canSpeak()) queueSpeech(turn, data.spoken); else setReply(data.spoken); }
            finishTurnSpeech(turn);
          } else if (ev === 'error') throw new Error(data.error || 'Chat failed.');
        }
      }
    } catch (error) {
      if (stale()) return;
      abortTurn();
      stateEl.textContent = 'Sorry';
      setReply(error && error.message ? error.message : 'Something went wrong.');
      await sleep(1500);
      if (id === sessionId && (state === 'thinking' || state === 'speaking')) enterListening(true);
    }
  }

  /* ---------- session lifecycle ---------- */
  async function startSession() {
    if (sessionActive) return;
    sessionId++; const id = sessionId; sessionActive = true; sessionTurns = 0;
    clearCaptions(); setNote(voiceStatus && voiceStatus.reason ? voiceStatus.reason : '');
    talkBtn.setAttribute('aria-pressed', 'true'); talkBtn.setAttribute('aria-label', 'End session');
    ensurePlayMeter();
    setState('greeting', 'Speaking');
    try {
      stream = await navigator.mediaDevices.getUserMedia({ audio: { channelCount: 1, echoCancellation: true, noiseSuppression: true, autoGainControl: true } });
    } catch {
      sessionActive = false; sessionId++;
      talkBtn.setAttribute('aria-pressed', 'false'); talkBtn.setAttribute('aria-label', 'Tap to talk');
      setState('error', 'Microphone blocked');
      setNote('Allow microphone access for this page, then tap again.');
      return;
    }
    if (id !== sessionId) { stream.getTracks().forEach((t) => t.stop()); return; }
    reportSession('start');
    const supportedTypes = ['audio/webm;codecs=opus', 'audio/webm', 'audio/mp4'];
    mimeType = (window.MediaRecorder && supportedTypes.find((t) => MediaRecorder.isTypeSupported(t))) || null;
    startMeter();
    conversationReady = openConversation(id);
    // The Silero model loads while the greeting plays, so the welcome is not held up by it.
    const vadReady = initVad();
    lastActivityAt = performance.now(); repromptedYet = false; repromptAt = 0;
    await playPrompt('greeting');
    await vadReady;
    if (id !== sessionId || state !== 'greeting') return;
    enterListening(true);
  }
  function teardownSession(reason) {
    if (sessionActive) { reportSession('end', { turns: sessionTurns, ...(reason ? { reason } : {}) }); notifyParent('ended'); }
    abortTurn(); fillerDone = Promise.resolve();
    sileroDiscard = true; sileroRunning = false; sileroSpeechAt = 0;
    sessionId++;
    sessionActive = false;
    setCapturing(false); speechSince = 0; silenceSince = 0; repromptedYet = false; repromptAt = 0;
    cancelAnimationFrame(listenRaf); listenRaf = 0;
    stopMeter();
    if (recorder) { try { recorder.ondataavailable = recorder.onstop = recorder.onerror = null; if (recorder.state !== 'inactive') recorder.stop(); } catch {} recorder = null; }
    if (sileroVad) { const old = sileroVad; sileroVad = null; Promise.resolve().then(() => old.destroy?.()).catch(() => {}).finally(() => { sileroDiscard = false; }); }
    vadMode = 'energy';
    if (stream) { stream.getTracks().forEach((t) => t.stop()); stream = null; }
    stopSpeaking();
    talkBtn.setAttribute('aria-pressed', 'false'); talkBtn.setAttribute('aria-label', 'Tap to talk');
    setState('idle', 'Tap to talk');
  }
  function endSessionManual() {
    if (capturing) { try { recorder && recorder.state !== 'inactive' && recorder.stop(); } catch {} }
    teardownSession('press');
  }

  function onPress() {
    if (talkBtn.disabled) return;
    if (state === 'idle' || state === 'error') void startSession();
    else if (state === 'greeting' || state === 'speaking' || (state === 'thinking' && turnSpeech && turnSpeech.spoke)) {
      abortTurn(); stopSpeaking(); enterListening(true);
    }
    else if (state === 'listening' || state === 'thinking') endSessionManual();
  }

  /* ---------- input ---------- */
  talkBtn.addEventListener('click', onPress);
  window.addEventListener('keydown', (event) => {
    if (event.key === 'Escape') {
      if (sessionActive) { event.preventDefault(); endSessionManual(); }
      // Embedded, focus lives in this frame, so the chat page's dialog never sees Escape: ask it to close.
      if (embedded) notifyParent('close');
      return;
    }
    if (event.code === 'Space') {
      const active = document.activeElement;
      if (active === muteBtn || (active && active.tagName === 'A')) return;
      event.preventDefault();
      onPress();
    }
  });
  window.addEventListener('pagehide', () => { teardownSession(); });
  void statusReady;
})();
</script>
</body>
</html>
