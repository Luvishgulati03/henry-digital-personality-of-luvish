<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Henry — Chat</title>
<style>
  :root {
    --bg: #1f1e1b;
    --surface: #262522;
    --surface-2: #2d2c28;
    --composer: #30302a;
    --border: #3d3c36;
    --border-soft: #34332e;
    --text: #eceae2;
    --text-dim: #a8a69b;
    --text-faint: #7d7b71;
    --accent: #34d399;
    --accent-dim: #1d5c44;
    --danger: #f87171;
    --code-bg: #191813;
    --sans: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    --serif: ui-serif, "New York", Georgia, "Times New Roman", serif;
    --mono: ui-monospace, "SF Mono", SFMono-Regular, Menlo, Consolas, monospace;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { height: 100%; }
  body {
    background: var(--bg);
    color: var(--text);
    font-family: var(--sans);
    display: flex;
    flex-direction: column;
    overflow: hidden;
  }

  /* ---------- header ---------- */
  header {
    display: flex; align-items: center; justify-content: space-between;
    padding: 10px 18px;
    border-bottom: 1px solid var(--border-soft);
    background: color-mix(in srgb, var(--bg) 88%, black);
    flex: 0 0 auto;
  }
  .brand { display: flex; align-items: center; gap: 10px; font-weight: 600; letter-spacing: .2px; }
  .brand .dot { width: 8px; height: 8px; border-radius: 50%; background: var(--accent); box-shadow: 0 0 8px var(--accent); }
  .brand small { color: var(--text-faint); font-weight: 400; }
  .header-right { display: flex; align-items: center; gap: 10px; }
  .chip {
    font-size: 11.5px; color: var(--text-dim); border: 1px solid var(--border); border-radius: 999px;
    padding: 3px 10px; background: var(--surface); font-family: var(--mono);
  }
  .btn {
    appearance: none; border: 1px solid var(--border); background: var(--surface); color: var(--text-dim);
    border-radius: 10px; padding: 6px 12px; font-size: 13px; cursor: pointer; font-family: var(--sans);
    transition: color .15s, border-color .15s, background .15s;
  }
  .btn:hover { color: var(--text); border-color: var(--text-faint); }
  .btn:disabled { opacity: .45; cursor: default; }
  a.btn { text-decoration: none; display: inline-block; }

  /* ---------- transcript ---------- */
  #scroller { flex: 1 1 auto; overflow-y: auto; scroll-behavior: smooth; }
  #thread { max-width: 768px; margin: 0 auto; padding: 28px 20px 40px; display: flex; flex-direction: column; gap: 26px; }

  .empty {
    margin-top: 16vh; text-align: center; display: flex; flex-direction: column; align-items: center; gap: 14px;
    animation: rise .5s ease both;
  }
  .empty h1 { font-family: var(--serif); font-weight: 500; font-size: 34px; }
  .empty p { color: var(--text-dim); font-size: 15px; }
  .suggestions { display: flex; flex-wrap: wrap; gap: 10px; justify-content: center; margin-top: 10px; max-width: 560px; }
  .suggestion {
    border: 1px solid var(--border); background: var(--surface); color: var(--text-dim);
    padding: 9px 14px; border-radius: 14px; font-size: 13.5px; cursor: pointer; transition: all .15s;
  }
  .suggestion:hover { color: var(--text); border-color: var(--accent-dim); background: var(--surface-2); transform: translateY(-1px); }

  .row { display: flex; flex-direction: column; gap: 6px; animation: rise .25s ease both; }
  @keyframes rise { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: none; } }
  @media (prefers-reduced-motion: reduce) { .row, .empty { animation: none; } }

  .row.user { align-items: flex-end; }
  .row.user .bubble {
    background: var(--composer); border: 1px solid var(--border-soft);
    padding: 11px 16px; border-radius: 18px 18px 4px 18px; max-width: 82%;
    font-size: 15px; line-height: 1.55; white-space: pre-wrap; word-wrap: break-word;
  }

  .row.henry { align-items: stretch; }
  .henry-head { display: flex; align-items: center; gap: 9px; }
  .avatar {
    width: 26px; height: 26px; border-radius: 50%; flex: 0 0 auto;
    background: radial-gradient(circle at 30% 30%, #4ade80, #15803d);
    display: flex; align-items: center; justify-content: center;
    font-size: 13px; font-weight: 700; color: #052e16;
  }
  .henry-name { font-size: 12.5px; color: var(--text-faint); }
  .prose {
    font-family: var(--serif); font-size: 16.5px; line-height: 1.68; color: var(--text);
    padding-left: 35px; word-wrap: break-word;
  }
  .prose > * + * { margin-top: .85em; }
  .prose h1, .prose h2, .prose h3 { font-family: var(--sans); font-weight: 650; line-height: 1.3; }
  .prose h1 { font-size: 20px; } .prose h2 { font-size: 18px; } .prose h3 { font-size: 16px; }
  .prose ul, .prose ol { padding-left: 22px; display: flex; flex-direction: column; gap: .35em; }
  .prose blockquote { border-left: 3px solid var(--accent-dim); padding: 2px 0 2px 14px; color: var(--text-dim); }
  .prose hr { border: none; border-top: 1px solid var(--border-soft); }
  .prose a { color: var(--accent); text-decoration: none; border-bottom: 1px solid var(--accent-dim); }
  .prose code { font-family: var(--mono); font-size: .86em; background: var(--surface-2); border: 1px solid var(--border-soft); border-radius: 5px; padding: 1.5px 5.5px; }
  .codeblock { border: 1px solid var(--border-soft); border-radius: 10px; overflow: hidden; background: var(--code-bg); font-family: var(--sans); }
  .codeblock-bar { display: flex; justify-content: space-between; align-items: center; padding: 6px 12px; background: var(--surface-2); font-size: 11.5px; color: var(--text-faint); }
  .codeblock-bar button { border: none; background: none; color: var(--text-faint); font-size: 11.5px; cursor: pointer; font-family: var(--sans); }
  .codeblock-bar button:hover { color: var(--text); }
  .codeblock pre { padding: 13px 14px; overflow-x: auto; }
  .codeblock code { font-family: var(--mono); font-size: 13px; line-height: 1.55; background: none; border: none; padding: 0; color: #d5f5e3; }

  .thinking { display: flex; align-items: center; gap: 10px; padding-left: 35px; color: var(--text-faint); font-size: 14px; }
  .thinking .pulse { display: inline-flex; gap: 4px; }
  .thinking .pulse i { width: 5px; height: 5px; border-radius: 50%; background: var(--accent); animation: blink 1.2s infinite; }
  .thinking .pulse i:nth-child(2) { animation-delay: .2s; } .thinking .pulse i:nth-child(3) { animation-delay: .4s; }
  @keyframes blink { 0%, 70%, 100% { opacity: .25; } 35% { opacity: 1; } }
  .caret { display: inline-block; width: 7px; height: 17px; background: var(--accent); vertical-align: -3px; margin-left: 2px; animation: blink 1s infinite; border-radius: 1px; }

  .sysline { padding-left: 35px; font-size: 13px; color: var(--danger); }
  .meta { padding-left: 35px; font-size: 11.5px; color: var(--text-faint); font-family: var(--mono); }

  /* ---------- composer ---------- */
  .composer-zone { flex: 0 0 auto; padding: 0 20px 18px; background: linear-gradient(transparent, var(--bg) 38%); }
  .composer {
    max-width: 768px; margin: 0 auto; background: var(--composer);
    border: 1px solid var(--border); border-radius: 22px; padding: 12px 14px 10px;
    box-shadow: 0 8px 28px rgba(0,0,0,.35);
    transition: border-color .2s;
  }
  .composer:focus-within { border-color: color-mix(in srgb, var(--accent) 45%, var(--border)); }
  .composer textarea {
    width: 100%; resize: none; border: none; outline: none; background: none; color: var(--text);
    font-family: var(--sans); font-size: 15px; line-height: 1.5; max-height: 200px;
  }
  .composer textarea::placeholder { color: var(--text-faint); }
  .composer-row { display: flex; align-items: center; justify-content: space-between; margin-top: 8px; }
  .hint { font-size: 11.5px; color: var(--text-faint); }
  #send {
    width: 34px; height: 34px; border-radius: 50%; border: none; cursor: pointer;
    background: var(--accent); color: #052e16; display: flex; align-items: center; justify-content: center;
    transition: transform .12s, background .15s, opacity .15s;
  }
  #send:hover { transform: scale(1.06); }
  #send:disabled { background: var(--surface-2); color: var(--text-faint); cursor: default; transform: none; }
  #send.stop { background: var(--danger); color: #450a0a; }
  #send svg { width: 17px; height: 17px; }

  #jump {
    position: fixed; bottom: 108px; left: 50%; transform: translateX(-50%);
    border-radius: 999px; padding: 6px 14px; font-size: 12.5px;
    background: var(--surface-2); border: 1px solid var(--border); color: var(--text-dim);
    cursor: pointer; display: none; z-index: 5;
  }
  #jump.show { display: block; }

  #scroller::-webkit-scrollbar { width: 10px; }
  #scroller::-webkit-scrollbar-thumb { background: var(--border); border-radius: 8px; border: 2px solid var(--bg); }
  @media (max-width: 640px) {
    #thread { padding: 20px 12px 30px; }
    .prose { padding-left: 0; }
    .thinking, .sysline, .meta { padding-left: 0; }
    .empty h1 { font-size: 26px; }
  }
</style>
</head>
<body>
<header>
  <div class="brand"><span class="dot"></span>Henry <small>· chat</small></div>
  <div class="header-right">
    <span class="chip" id="provider">…</span>
    <a class="btn" href="/" title="Mission control">Dashboard</a>
    <button class="btn" id="newchat" title="Start a fresh conversation">＋ New chat</button>
  </div>
</header>

<div id="scroller">
  <div id="thread"></div>
</div>
<button id="jump">↓ Latest</button>

<div class="composer-zone">
  <div class="composer">
    <textarea id="input" rows="1" placeholder="Message Henry…" autofocus></textarea>
    <div class="composer-row">
      <span class="hint">Enter to send · Shift+Enter for a new line</span>
      <button id="send" title="Send" disabled>
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M12 19V5M5 12l7-7 7 7"/></svg>
      </button>
    </div>
  </div>
</div>

<script>
(function () {
  "use strict";
  var thread = document.getElementById("thread");
  var scroller = document.getElementById("scroller");
  var input = document.getElementById("input");
  var send = document.getElementById("send");
  var jump = document.getElementById("jump");
  var newchat = document.getElementById("newchat");
  var providerChip = document.getElementById("provider");
  var streaming = false;
  var aborter = null;

  var SEND_SVG = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M12 19V5M5 12l7-7 7 7"/></svg>';
  var STOP_SVG = '<svg viewBox="0 0 24 24" fill="currentColor"><rect x="6" y="6" width="12" height="12" rx="2"/></svg>';

  /* ---------- minimal, escape-first markdown ---------- */
  function esc(s) {
    return s.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;").replace(/"/g, "&quot;");
  }
  function inline(s) {
    return s
      .replace(/`([^`\n]+)`/g, function (_m, c) { return "<code>" + c + "</code>"; })
      .replace(/\*\*([^*\n]+)\*\*/g, "<strong>$1</strong>")
      .replace(/(^|[\s(])\*([^*\n]+)\*(?=[\s).,!?:;]|$)/g, "$1<em>$2</em>")
      .replace(/\[([^\]\n]+)\]\((https?:\/\/[^)\s]+)\)/g, '<a href="$2" target="_blank" rel="noopener noreferrer">$1</a>');
  }
  function renderMarkdown(src) {
    var fences = [];
    src = src.replace(/```([\w+-]*)\n?([\s\S]*?)(?:```|$)/g, function (_m, lang, code) {
      fences.push({ lang: lang || "", code: code.replace(/\n$/, "") });
      return "\u0000F" + (fences.length - 1) + "\u0000";
    });
    var lines = esc(src).split("\n");
    var html = [], list = null, quote = false, para = [];
    function flushPara() {
      if (para.length) { html.push("<p>" + inline(para.join("<br>")) + "</p>"); para = []; }
    }
    function flushList() { if (list) { html.push("</" + list + ">"); list = null; } }
    function flushQuote() { if (quote) { html.push("</blockquote>"); quote = false; } }
    for (var i = 0; i < lines.length; i++) {
      var line = lines[i];
      var fence = line.match(/^\u0000F(\d+)\u0000\s*$/);
      var h = line.match(/^(#{1,3})\s+(.*)$/);
      var ul = line.match(/^\s*[-*]\s+(.*)$/);
      var ol = line.match(/^\s*\d+[.)]\s+(.*)$/);
      var bq = line.match(/^>\s?(.*)$/);
      // Guard the placeholder lookup: a reply that literally contains " F<n> " on its
      // own line (with no matching fence) must render as text, not crash the renderer.
      if (fence && fences[Number(fence[1])]) {
        flushPara(); flushList(); flushQuote();
        var f = fences[Number(fence[1])];
        html.push('<div class="codeblock"><div class="codeblock-bar"><span>' + (esc(f.lang) || "code") + '</span><button onclick="window.__copy(this)">Copy</button></div><pre><code>' + esc(f.code) + "</code></pre></div>");
      } else if (h) {
        flushPara(); flushList(); flushQuote();
        var level = h[1].length;
        html.push("<h" + level + ">" + inline(h[2]) + "</h" + level + ">");
      } else if (ul || ol) {
        flushPara(); flushQuote();
        var want = ul ? "ul" : "ol";
        if (list !== want) { flushList(); html.push("<" + want + ">"); list = want; }
        html.push("<li>" + inline((ul || ol)[1]) + "</li>");
      } else if (bq) {
        flushPara(); flushList();
        if (!quote) { html.push("<blockquote>"); quote = true; }
        html.push("<p>" + inline(bq[1]) + "</p>");
      } else if (/^\s*(---+|\*\*\*+)\s*$/.test(line)) {
        flushPara(); flushList(); flushQuote(); html.push("<hr>");
      } else if (line.trim() === "") {
        flushPara(); flushList(); flushQuote();
      } else {
        flushList(); flushQuote(); para.push(line);
      }
    }
    flushPara(); flushList(); flushQuote();
    return html.join("");
  }
  window.__copy = function (btn) {
    var code = btn.closest(".codeblock").querySelector("code").textContent;
    navigator.clipboard.writeText(code).then(function () {
      btn.textContent = "Copied";
      setTimeout(function () { btn.textContent = "Copy"; }, 1400);
    });
  };

  /* ---------- transcript rendering ---------- */
  function nearBottom() { return scroller.scrollHeight - scroller.scrollTop - scroller.clientHeight < 90; }
  function scrollBottom(force) {
    if (force || nearBottom()) scroller.scrollTop = scroller.scrollHeight;
    jump.classList.toggle("show", !nearBottom());
  }
  scroller.addEventListener("scroll", function () { jump.classList.toggle("show", !nearBottom()); });
  jump.addEventListener("click", function () { scrollBottom(true); });

  function addUser(text) {
    clearEmpty();
    var row = document.createElement("div");
    row.className = "row user";
    var bubble = document.createElement("div");
    bubble.className = "bubble";
    bubble.textContent = text;
    row.appendChild(bubble);
    thread.appendChild(row);
    scrollBottom(true);
  }
  function addHenryShell() {
    var row = document.createElement("div");
    row.className = "row henry";
    row.innerHTML = '<div class="henry-head"><div class="avatar">H</div><span class="henry-name">Henry</span></div>' +
      '<div class="thinking"><span class="pulse"><i></i><i></i><i></i></span> Henry is thinking…</div>' +
      '<div class="prose" style="display:none"></div>';
    thread.appendChild(row);
    scrollBottom(true);
    return row;
  }
  function addError(row, message) {
    var line = document.createElement("div");
    line.className = "sysline";
    line.textContent = message;
    row.appendChild(line);
  }
  function clearEmpty() {
    var empty = thread.querySelector(".empty");
    if (empty) empty.remove();
  }
  function showEmpty() {
    thread.innerHTML = '<div class="empty">' +
      '<h1>Hey Luvish 👋</h1>' +
      "<p>Terminal, Telegram, and now here — what can I do for you?</p>" +
      '<div class="suggestions">' +
      '<button class="suggestion">Have I applied to any company twice?</button>' +
      '<button class="suggestion">What did the team say in standup today?</button>' +
      "<button class=\"suggestion\">What's pending my approval right now?</button>" +
      "</div></div>";
    Array.prototype.forEach.call(thread.querySelectorAll(".suggestion"), function (btn) {
      btn.addEventListener("click", function () { input.value = btn.textContent; autoSize(); submit(); });
    });
  }

  /* ---------- history ---------- */
  fetch("/api/chat/history").then(function (r) { return r.json(); }).then(function (data) {
    var messages = (data && data.messages) || [];
    if (!messages.length) { showEmpty(); return; }
    messages.forEach(function (message) {
      if (message.role === "user") { addUser(message.text); return; }
      var row = addHenryShell();
      finishHenry(row, message.text);
    });
    scrollBottom(true);
  }).catch(function () {
    // Only show the empty-state when nothing rendered: a render hiccup after
    // messages were appended must not wipe the visible conversation.
    if (!thread.querySelector(".row")) showEmpty();
  });

  fetch("/api/status").then(function (r) { return r.json(); }).then(function (s) {
    providerChip.textContent = s.provider || "?";
  }).catch(function () { providerChip.textContent = "offline"; });

  function finishHenry(row, fullText) {
    var thinking = row.querySelector(".thinking");
    if (thinking) thinking.remove();
    var prose = row.querySelector(".prose");
    prose.style.display = "";
    prose.innerHTML = renderMarkdown(fullText);
  }

  /* ---------- send flow (SSE over fetch) ---------- */
  function setStreaming(on) {
    streaming = on;
    send.classList.toggle("stop", on);
    send.innerHTML = on ? STOP_SVG : SEND_SVG;
    send.title = on ? "Stop" : "Send";
    send.disabled = !on && input.value.trim() === "";
    input.disabled = false;
  }

  function submit() {
    if (streaming) { if (aborter) aborter.abort(); return; }
    var text = input.value.trim();
    if (!text) return;
    input.value = ""; autoSize();
    addUser(text);
    var row = addHenryShell();
    var prose = row.querySelector(".prose");
    var streamed = "";
    var gotDone = false;
    setStreaming(true);
    aborter = new AbortController();

    fetch("/api/chat/send", {
      method: "POST",
      headers: { "content-type": "application/json" },
      body: JSON.stringify({ prompt: text }),
      signal: aborter.signal,
    }).then(function (response) {
      if (!response.ok || !response.body) throw new Error("HTTP " + response.status);
      var reader = response.body.getReader();
      var decoder = new TextDecoder();
      var buffer = "";
      function pump() {
        return reader.read().then(function (chunk) {
          if (chunk.done) return;
          buffer += decoder.decode(chunk.value, { stream: true });
          var frames = buffer.split("\n\n");
          buffer = frames.pop() || "";
          frames.forEach(function (frame) {
            var event = "message", data = "";
            frame.split("\n").forEach(function (line) {
              if (line.indexOf("event: ") === 0) event = line.slice(7);
              else if (line.indexOf("data: ") === 0) data += line.slice(6);
            });
            if (!data) return;
            var payload;
            try { payload = JSON.parse(data); } catch (e) { return; }
            if (event === "token" && payload.text) {
              streamed += payload.text;
              var thinking = row.querySelector(".thinking");
              if (thinking) thinking.remove();
              prose.style.display = "";
              prose.innerHTML = renderMarkdown(streamed) + '<span class="caret"></span>';
              scrollBottom(false);
            } else if (event === "done") {
              gotDone = true;
              finishHenry(row, payload.response || streamed || "(no reply)");
              if (payload.provider && payload.durationMs) {
                var meta = document.createElement("div");
                meta.className = "meta";
                meta.textContent = payload.provider + " · " + (payload.durationMs / 1000).toFixed(1) + "s";
                row.appendChild(meta);
              }
              scrollBottom(false);
            } else if (event === "error") {
              gotDone = true;
              finishHenry(row, streamed || "");
              addError(row, "⚠ " + (payload.error || "Henry hit an error."));
            }
          });
          return pump();
        });
      }
      return pump();
    }).catch(function (error) {
      if (error && error.name === "AbortError") {
        finishHenry(row, streamed || "");
        addError(row, "Stopped — Henry finishes the thought server-side; it'll be in the transcript on reload.");
      } else if (!gotDone) {
        finishHenry(row, streamed || "");
        addError(row, "⚠ Connection lost: " + (error && error.message ? error.message : error));
      }
    }).finally(function () {
      setStreaming(false);
      aborter = null;
      input.focus();
    });
  }

  /* ---------- composer behaviors ---------- */
  function autoSize() {
    input.style.height = "auto";
    input.style.height = Math.min(input.scrollHeight, 200) + "px";
    if (!streaming) send.disabled = input.value.trim() === "";
  }
  input.addEventListener("input", autoSize);
  input.addEventListener("keydown", function (event) {
    if (event.key === "Enter" && !event.shiftKey) { event.preventDefault(); submit(); }
  });
  send.addEventListener("click", submit);
  autoSize();

  newchat.addEventListener("click", function () {
    if (streaming) return;
    fetch("/api/chat/clear", { method: "POST", headers: { "content-type": "application/json" }, body: "{}" })
      .then(function () { thread.innerHTML = ""; showEmpty(); input.focus(); });
  });
})();
</script>
</body>
</html>
